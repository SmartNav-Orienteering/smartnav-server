# SmartNav server with an optional Cloudflare Tunnel.
#
# 1. Copy .env.example to .env and fill it in.
# 2. Start the server:                  docker compose up -d
#    With Cloudflare Tunnel as well:    docker compose --profile tunnel up -d
# 3. Open http://<this machine>:8000/admin to create the owner account.
#
# All data (database, runs, map images) is kept in ./data. Back up that folder.

services:
  smartnav:
    build: .
    image: smartnav-server:latest
    container_name: smartnav
    restart: unless-stopped
    env_file: .env
    environment:
      SMARTNAV_DATA_DIR: /data
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"

  # Optional: publishes the server at your domain over HTTPS without opening
  # router ports. Create a tunnel in the Cloudflare dashboard (Zero Trust >
  # Networks > Tunnels), point its public hostname at http://smartnav:8000,
  # and paste the tunnel token into .env.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: smartnav-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - smartnav
    profiles: ["tunnel"]
