[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartnav-server"
version = "0.1.0"
description = "Club-hostable server for SmartNav GPS orienteering"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "smartnav-sdk>=0.1,<0.2",
  "smartnav-plugins>=0.1,<0.2",
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.34,<0.35",
  "sqlalchemy>=2.0,<2.1",
  "jinja2>=3.1,<3.2",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20",
  "itsdangerous>=2.2,<3",
  "segno>=1.6,<2",
  "tzdata",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.28"]

[project.scripts]
smartnav = "smartnav_server.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
smartnav_server = ["templates/**/*.html", "static/**/*"]
