[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartnav-plugins"
version = "0.1.0"
description = "Built-in SmartNav event types: line, score and scatter"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["smartnav-sdk>=0.1,<0.2"]

[project.entry-points."smartnav.event_types"]
line = "smartnav_plugins.line:LineEvent"
score = "smartnav_plugins.score:ScoreEvent"
scatter = "smartnav_plugins.scatter:ScatterEvent"

[tool.setuptools.packages.find]
where = ["src"]
